name: maurice Sequential CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # CAMADA 0: Path Filtering (dorny/paths-filter)
  # ==========================================================
  changes:
    name: 00 - Filter
    runs-on: ubuntu-latest
    outputs:
      core_py: ${{ steps.filter.outputs.core_py }}
      scripts: ${{ steps.filter.outputs.scripts }}
      tests: ${{ steps.filter.outputs.tests }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core_py:
              - '**/*.py'
              - 'pyproject.toml'
            scripts:
              - 'scripts/**/*.py'
            tests:
              - 'tests/**/*.py'
            container:
              - 'Containerfile'
            modelfiles:
              - 'modelfiles/**'

  # ==========================================================
  # CAMADA 1: Fast-Check Paralelo (< 30s)
  # ==========================================================
  lint_code:
    name: Lint Code (Ruff)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Lint
        run: |
          ruff check .

  format_code:
    name: Format (Ruff)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Formatting
        run: |
          ruff format --check .

  dryrun_01:
    name: Dryrun 01 (Datasets)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check 01_prepare_datasets
        run: |
          python -m py_compile scripts/01_prepare_datasets.py

  dryrun_02:
    name: Dryrun 02 (QLoRA)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check 02_train_qlora
        run: |
          python -m py_compile scripts/02_train_qlora.py

  dryrun_03:
    name: Dryrun 03 (Merge)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check 03_merge_weights
        run: |
          python -m py_compile scripts/03_merge_weights.py

  # ==========================================================
  # CAMADA 2: Análise Estática & Dryruns Dependentes
  # ==========================================================
  static_typing:
    name: 02A - Typing (mypy)
    needs: [lint_code, format_code]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run Type Check
        run: |
          mypy --ignore-missing-imports scripts/

  dryrun_05:
    name: Dryrun 05 (Benchmark)
    needs: [dryrun_01, dryrun_02]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check 05_benchmark_eval
        run: |
          python -m py_compile scripts/05_benchmark_eval.py

  dryrun_ci_scripts:
    name: Dryrun CI (Scripts)
    needs: dryrun_03
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check 06_serve_model & 07_publish_hub & 08_code_review & validate_reasoning
        run: |
          python -m py_compile scripts/06_serve_model.py
          python -m py_compile scripts/07_publish_hub.py
          python -m py_compile scripts/08_code_review.py
          python -m py_compile scripts/validate_reasoning.py
          python scripts/validate_reasoning.py --dry-run

  # ==========================================================
  # CAMADA 3: Processos de Testes Unitários Separados
  # ==========================================================
  unit_tests_datasets:
    name: 03A - Unit Tests (Schema & Datasets)
    needs: [static_typing, dryrun_05, dryrun_ci_scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install pytest datasets
          pip install -e . 2>/dev/null || true

      - name: Run Pytest Suite
        run: |
          pytest tests/test_01_prepare_datasets.py tests/test_dataset_filter.py -v -m "not slow"

  unit_tests_tokenizer:
    name: 03B - Unit Tests (Tokenizer & Prompts)
    needs: [static_typing, dryrun_05, dryrun_ci_scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install pytest datasets
          pip install -e . 2>/dev/null || true

      - name: Run Pytest Suite
        run: |
          pytest tests/test_02_train_qlora.py tests/test_05_benchmark_eval.py tests/test_validate_reasoning.py -v -m "not slow"

  unit_tests_model_config:
    name: 03C - Unit Tests (Model Config Unit)
    needs: [static_typing, dryrun_05, dryrun_ci_scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install pytest datasets
          pip install -e . 2>/dev/null || true

      - name: Run Pytest Suite
        run: |
          pytest tests/test_03_merge_weights.py tests/test_07_publish_hub.py tests/test_pipeline.py -v -m "not slow"

  unit_tests_serve:
    name: 03D - Unit Tests (Inference Server)
    needs: [static_typing, dryrun_05, dryrun_ci_scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install pytest fastapi uvicorn "httpx<0.28.0"
          pip install -e . 2>/dev/null || true

      - name: Run Pytest Suite
        run: |
          pytest tests/test_06_serve_model.py -v -m "not slow"

  # ==========================================================
  # CAMADA 4: Isolamento do Build e Smoke Test Nativo C++
  # ==========================================================
  podman_setup:
    name: 04A - Podman Engine Setup
    needs: [changes, unit_tests_datasets, unit_tests_tokenizer, unit_tests_model_config, unit_tests_serve]
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman version

  container_layer_build:
    name: 04B - Containerfile Layer Compilation
    needs: podman_setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Containerfile
        run: |
          podman build -t maurice:ci -f Containerfile .

      - name: Save Container Image Artifact
        run: |
          mkdir -p /tmp/container-image
          podman save maurice:ci -o /tmp/container-image/maurice-ci.tar

      - name: Upload Container Image
        uses: actions/upload-artifact@v4
        with:
          name: maurice-container-image
          path: /tmp/container-image/maurice-ci.tar
          retention-days: 1

  container_native_smoke:
    name: 04C - C++ Native Binary Smoke
    needs: container_layer_build
    runs-on: ubuntu-latest
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download Container Image
        uses: actions/download-artifact@v4
        with:
          name: maurice-container-image
          path: /tmp/container-image

      - name: Load Container Image
        run: |
          podman load -i /tmp/container-image/maurice-ci.tar

      - name: Validate Binary Execution Inside Container
        run: |
          podman run --rm maurice:ci llama-cli --help
          podman run --rm maurice:ci ldd /home/maurice/bin/llama-cli

  # ==========================================================
  # CAMADA 5: Gatekeeper Central para Regras de Proteção de Branch
  # ==========================================================
  status_gatekeeper:
    name: 05 - Branch Protection Gatekeeper
    if: always()
    needs:
      - changes
      - lint_code
      - format_code
      - dryrun_01
      - dryrun_02
      - dryrun_03
      - static_typing
      - dryrun_05
      - dryrun_ci_scripts
      - unit_tests_datasets
      - unit_tests_tokenizer
      - unit_tests_model_config
      - unit_tests_serve
      - podman_setup
      - container_layer_build
      - container_native_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate DAG Workflow Results
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          echo "DAG node results: $RESULTS"
          if [[ "$RESULTS" =~ "failure" ]] || [[ "$RESULTS" =~ "cancelled" ]]; then
            echo "One or more required DAG jobs failed or were cancelled."
            exit 1
          fi
          echo "All required DAG jobs passed or were skipped successfully."
